<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Thank you for submitting your product review. See how many reviews have been submitted so far." />
    <meta name="author" content="Ulises Antonio Tzaj" />
    <title>Review Confirmation</title>
    <link rel="stylesheet" href="styles/form.css" />
</head>

<body>
    <header>
        <h1>Thank you for your review!</h1>
    </header>

    <div class="confirmation">
        <p>Total Reviews Submitted: <span id="reviewCount"></span></p>
        <a href="form.html">Submit another review</a>
    </div>

    <footer>
        <p>©2025 🌵 Ulises Antonio Tzaj 🌵 Guatemala</p>
    </footer>

    <script>
        let count = localStorage.getItem('reviewCount') || 0;
        count++;
        localStorage.setItem('reviewCount', count);
        document.getElementById('reviewCount').textContent = count;
    </script>
</body>

</html>
