<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Submit a product review for our store. Rate your product, share your experience, and help other customers make informed decisions." />
    <meta name="author" content="Ulises Antonio Tzaj" />
    <title>Product Review</title>
    <link rel="stylesheet" href="styles/form.css" />
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <form action="review.html" method="get">

        <label for="product">Product Name</label>
        <select id="product" name="product" required>
            <option value="" disabled selected>Select a Product ...</option>
        </select>

        <fieldset>
            <legend>Overall Rating</legend>
            <div class="rating-options">
                <label for="rating-1"><input type="radio" id="rating-1" name="rating" value="1" required> ★</label>
                <label for="rating-2"><input type="radio" id="rating-2" name="rating" value="2" required> ★★</label>
                <label for="rating-3"><input type="radio" id="rating-3" name="rating" value="3" required> ★★★</label>
                <label for="rating-4"><input type="radio" id="rating-4" name="rating" value="4" required> ★★★★</label>
                <label for="rating-5"><input type="radio" id="rating-5" name="rating" value="5" required> ★★★★★</label>
            </div>
        </fieldset>

        <label for="installation">Date of Installation</label>
        <input type="date" id="installation" name="installation" required>

        <fieldset>
            <legend>Which features did you find useful in the product?<br><small>(Check all that apply)</small></legend>
            <div class="features-options">
                <label for="durability"><input type="checkbox" id="durability" name="features" value="Durability">
                    Durability</label>
                <label for="ease"><input type="checkbox" id="ease" name="features" value="Ease of Use"> Ease of
                    Use</label>
                <label for="performance"><input type="checkbox" id="performance" name="features" value="Performance">
                    Performance</label>
                <label for="design"><input type="checkbox" id="design" name="features" value="Design"> Design</label>
            </div>
        </fieldset>

        <label for="review">Written Review <small>(Optional)</small></label>
        <textarea id="review" name="review" rows="4" cols="30"></textarea>

        <label for="username">Your Name <small>(Optional)</small></label>
        <input type="text" id="username" name="username">

        <input type="submit" value="Post Review">
    </form>

    <footer>
        <p>©2025 🌵 Ulises Antonio Tzaj 🌵 Guatemala</p>
        <p>Last Updated: <span id="last-updated"></span></p>
    </footer>

    <script src="scripts/form.js" defer></script>
</body>

</html>
